<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>String Curtain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d10; color: #fff;
               font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  video { display: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 14px; background: rgba(13,13,16,.55); text-align: center; padding: 24px; }
  #start h1 { font-size: 20px; font-weight: 500; margin: 0 0 6px; letter-spacing: .02em; }
  #start p { margin: 0; font-size: 14px; opacity: .75; line-height: 1.6; }
  #start button { font: inherit; font-size: 16px; color: #fff; background: transparent; cursor: pointer;
                  border: 1px solid rgba(255,255,255,.8); border-radius: 999px; padding: 12px 28px; }
  #start button.sub { border-color: rgba(255,255,255,.3); font-size: 14px; padding: 9px 20px; opacity: .8; }
  #msg { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 13px; opacity: .7;
         pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="cam" playsinline muted></video>
<div id="start">
  <h1>String Curtain</h1>
  <p>카메라를 켜면 손과 얼굴이 줄커튼을 움직입니다.<br>영상은 이 기기 안에서만 처리되고 어디에도 저장·전송되지 않아요.</p>
  <button id="btnCam">카메라 켜기</button>
  <button id="btnMouse" class="sub">마우스/터치로만 해보기</button>
</div>
<div id="msg"></div>
<script>
/* ============ 여기만 바꾸면 됩니다 ============ */

// 줄에 들어갈 글자. 한 줄이 한 가닥에 쓰입니다. 줄 수보다 적으면 반복돼요.
const TEXT_LINES = [
  "길은 걷는 사람 앞에서만 열리고 바람은 지나간 자리에 소리를 남긴다",
  "멀리 가려면 천천히 걷고 오래 보려면 가만히 서 있어야 한다",
  "처음 만난 풍경은 오래된 기억처럼 낯설고도 다정하다",
  "지붕 끝에 걸린 구름이 느리게 흘러 저녁이 된다",
  "돌아오는 길에 비로소 떠나온 곳이 보인다",
];

const STRING_SPACING = 90;     // 줄 사이 간격(px) — 클수록 듬성듬성
const FONT_SIZE      = 20;     // 글자 크기(px)
const CHAR_SPACING   = 26;     // 글자 사이 세로 간격(px)
const LENGTH_RATIO   = 1.05;   // 줄 길이 (화면 높이의 몇 배, 1 이상이면 바닥까지)
const LENGTH_RANDOM  = 0;      // 줄마다 길이가 다른 정도 (0 = 모두 바닥까지)
const FONT           = "serif";
const TEXT_COLOR     = "#ffffff";
const BG_COLOR       = "#0d0d10";
const VIDEO_DIM      = 0.55;   // 카메라 영상 밝기 (0 = 안 보임, 1 = 원본)

// 움직임 느낌
const GRAVITY    = 0.25;   // 늘어지는 힘
const RETURN     = 0.012;  // 제자리로 돌아오려는 힘 (클수록 빨리 복귀)
const DAMPING    = 0.985;  // 1에 가까울수록 오래 출렁임
const PUSH_POWER = 0.7;    // 밀어내는 세기
const PUSH_SWEEP = 0.4;    // 손·얼굴이 움직이는 속도가 줄에 전달되는 정도

// 소리
const SOUND_ON     = true;
const SOUND_VOLUME = 0.5;                       // 0 ~ 1
const SCALE_HZ     = [262, 294, 330, 392, 440, 523, 587, 659, 784]; // 종소리 음계(도레미솔라...)

// 밀어내는 위치
const PUSH_RADIUS = 110;   // 마우스일 때 범위 반지름(px)
const HAND_RADIUS = 0.55;  // 손 크기 대비 범위 (클수록 넓게 밀어냄)
const BODY_SCALE  = 1.0;   // 몸 영역 크기 배율 (줄이 몸에서 더 떨어지길 원하면 1.2처럼 키우기)
const BODY_MARGIN = 6;     // 몸 둘레 여유(px)
const SHOW_BODY   = false; // true로 바꾸면 인식된 몸 영역(머리·어깨·팔)을 선으로 보여줘요

/* ============ 밀어내는 위치 ============ */
// 좌표는 화면(px). id가 같으면 이전 프레임과 비교해 이동 속도를 계산합니다.
let pushers = [];  // 예: [{ id: "a", x: 300, y: 400, radius: 110 }]
let mousePusher = null, trackedPushers = [];

function setPushers(list) {
  pushers = list.map(p => {
    const prev = pushers.find(q => q.id === p.id) || null;
    return { id: p.id, x: p.x, y: p.y, radius: p.radius || PUSH_RADIUS,
             vx: prev ? p.x - prev.x : 0, vy: prev ? p.y - prev.y : 0 };
  });
}
const refreshPushers = () => setPushers([...(mousePusher ? [mousePusher] : []), ...trackedPushers]);

const cv = document.getElementById("c");
cv.addEventListener("pointermove", e => { mousePusher = { id: "mouse", x: e.clientX, y: e.clientY }; refreshPushers(); });
cv.addEventListener("pointerdown", e => { mousePusher = { id: "mouse", x: e.clientX, y: e.clientY }; refreshPushers(); });
cv.addEventListener("pointerleave", () => { mousePusher = null; refreshPushers(); });
cv.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") { mousePusher = null; refreshPushers(); } });

/* ============ 줄 커튼 엔진 (건드리지 않아도 돼요) ============ */
const ctx = cv.getContext("2d");
const video = document.getElementById("cam");
let W, H, strings = [], videoOn = false, energy = 0, hitX = 0.5;
let bodyShapes = [];   // 몸 영역: 캡슐(두 점 + 굵기) 목록, 화면 px. 줄이 이 안으로 들어가지 못해요.
let bodyHit = 0;

function collideBody(pts) {
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i];
    for (const c of bodyShapes) {
      const abx = c.bx - c.ax, aby = c.by - c.ay;
      let t = ((p.x - c.ax) * abx + (p.y - c.ay) * aby) / (abx * abx + aby * aby || 1);
      t = Math.max(0, Math.min(1, t));
      const qx = c.ax + abx * t, qy = c.ay + aby * t;
      const dx = p.x - qx, dy = p.y - qy, d = Math.hypot(dx, dy), R = c.r + BODY_MARGIN;
      if (d < R) {
        const nx = d > 0.001 ? dx / d : 0, ny = d > 0.001 ? dy / d : -1;
        const sx = nx * (R - d), sy = ny * (R - d);
        p.x += sx; p.y += sy;
        p.px += sx; p.py += sy;                    // 속도는 유지 → 몸 표면을 타고 미끄러져요
        p.px += (p.x - p.px) * 0.25;               // 약간의 마찰
        p.py += (p.y - p.py) * 0.25;
        bodyHit += Math.min(Math.hypot(sx, sy), 6);
      }
    }
  }
}

function build() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  strings = [];
  const count = Math.max(3, Math.floor(W / STRING_SPACING));
  const x0 = (W - (count - 1) * STRING_SPACING) / 2;
  for (let s = 0; s < count; s++) {
    const text = [...TEXT_LINES[s % TEXT_LINES.length]];
    const len = H * LENGTH_RATIO * (1 - Math.random() * LENGTH_RANDOM);
    const n = Math.max(2, Math.floor(len / CHAR_SPACING));
    const x = x0 + s * STRING_SPACING;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const y = i * CHAR_SPACING - CHAR_SPACING;    // 맨 위는 화면 밖에 고정
      pts.push({ x, y, px: x, py: y, rx: x, ry: y, ch: text[(i + s * 3) % text.length] });
    }
    strings.push(pts);
  }
}

function step() {
  let e = 0, ex = 0; bodyHit = 0;
  for (const pts of strings) {
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i];
      let vx = (p.x - p.px) * DAMPING;
      let vy = (p.y - p.py) * DAMPING;
      vy += GRAVITY;
      vx += (p.rx - p.x) * RETURN;
      vy += (p.ry - p.y) * RETURN;
      for (const m of pushers) {
        const dx = p.x - m.x, dy = p.y - m.y;
        const d = Math.hypot(dx, dy);
        if (d < m.radius && d > 0.01) {
          const f = Math.pow(1 - d / m.radius, 2);
          const sp = Math.hypot(m.vx, m.vy);
          vx += (dx / d) * f * PUSH_POWER * 10 + m.vx * f * PUSH_SWEEP;
          vy += (dy / d) * f * PUSH_POWER * 3  + m.vy * f * PUSH_SWEEP * 0.3;
          if (d < m.radius * 0.5) {                 // 몸이 줄을 통과하지 못하게 살짝 밀어냄
            const k = (m.radius * 0.5 - d) * 0.25;
            p.x += (dx / d) * k; p.y += (dy / d) * k * 0.3;
          }
          const w = f * sp * 0.12;            // 움직일 때만 소리 (가만히 있으면 무음)
          e += w; ex += w * m.x;
        }
      }
      p.px = p.x; p.py = p.y;
      p.x += vx;  p.y += vy;
    }
    for (let it = 0; it < 10; it++) {
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const diff = (d - CHAR_SPACING) / d;
        if (i - 1 === 0) { b.x -= dx * diff; b.y -= dy * diff; }
        else { a.x += dx * diff * 0.5; a.y += dy * diff * 0.5; b.x -= dx * diff * 0.5; b.y -= dy * diff * 0.5; }
      }
      if (bodyShapes.length) collideBody(pts);
    }
  }
  e += bodyHit * 0.04;
  energy = Math.min(e, 12); if (e > 0) hitX = ex / e / W;
  for (const m of pushers) { m.vx *= 0.8; m.vy *= 0.8; }
}

function drawVideo() {
  if (!videoOn || video.readyState < 2) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh);
  ctx.save();
  ctx.globalAlpha = VIDEO_DIM;
  ctx.translate(W, 0); ctx.scale(-1, 1);              // 거울처럼 좌우 반전
  ctx.drawImage(video, (W - vw * s) / 2, (H - vh * s) / 2, vw * s, vh * s);
  ctx.restore();
}

function draw() {
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, W, H);
  drawVideo();
  ctx.fillStyle = TEXT_COLOR;
  ctx.font = FONT_SIZE + "px " + FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 4;
  for (const pts of strings) {
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)], c = pts[i - 1];
      const ang = i === pts.length - 1 ? Math.atan2(a.y - c.y, a.x - c.x) : Math.atan2(b.y - a.y, b.x - a.x);
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(ang - Math.PI / 2);
      ctx.fillText(a.ch, 0, 0);
      ctx.restore();
    }
  }
  ctx.shadowBlur = 0;
  if (SHOW_BODY) {
    ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineCap = "round";
    for (const c of bodyShapes) { ctx.lineWidth = c.r * 2; ctx.beginPath(); ctx.moveTo(c.ax, c.ay); ctx.lineTo(c.bx, c.by); ctx.stroke(); }
  }
}

/* ============ 소리 ============ */
let ac = null, noiseGain, noiseFilter, lastChime = 0;
function startAudio() {
  if (!SOUND_ON || ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    noiseFilter = ac.createBiquadFilter(); noiseFilter.type = "bandpass"; noiseFilter.Q.value = 0.8; noiseFilter.frequency.value = 1500;
    noiseGain = ac.createGain(); noiseGain.gain.value = 0;
    src.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ac.destination);
    src.start();
  } catch (e) { ac = null; }
}
function updateAudio(now) {
  if (!ac) return;
  const t = ac.currentTime;
  noiseGain.gain.setTargetAtTime(Math.min(0.06, energy * 0.004) * SOUND_VOLUME * 2, t, 0.06);   // 스르륵 천 스치는 소리
  noiseFilter.frequency.setTargetAtTime(900 + Math.min(energy, 20) * 130, t, 0.08);
  if (energy > 5 && now - lastChime > 600) {                                                   // 가끔 울리는 맑은 종소리
    lastChime = now;
    const f = SCALE_HZ[Math.min(SCALE_HZ.length - 1, Math.floor(hitX * SCALE_HZ.length))];
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.10 * SOUND_VOLUME, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 1.7);
  }
}

/* ============ 손·얼굴 인식 (MediaPipe) ============ */
const msg = document.getElementById("msg");
let handLM = null, poseLM = null, lastVideoTime = -1;
const HAND_POINTS = [0, 4, 8, 12, 16, 20, 5, 9, 13, 17];

function toScreen(lm) {                                 // 영상 좌표(0~1) → 화면 px (거울 + cover)
  const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh);
  return { x: (W - vw * s) / 2 + (1 - lm.x) * vw * s, y: (H - vh * s) / 2 + lm.y * vh * s };
}

async function startCamera() {
  msg.textContent = "카메라 여는 중…";
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
  video.srcObject = stream; await video.play(); videoOn = true;
  msg.textContent = "손과 얼굴 인식 준비 중…";
  const V = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const { FilesetResolver, HandLandmarker, PoseLandmarker } = await import(V + "/vision_bundle.mjs");
  const files = await FilesetResolver.forVisionTasks(V + "/wasm");
  const M = "https://storage.googleapis.com/mediapipe-models/";
  const make = async (Cls, path, extra) => {
    for (const delegate of ["GPU", "CPU"]) {
      try { return await Cls.createFromOptions(files, { baseOptions: { modelAssetPath: M + path, delegate }, runningMode: "VIDEO", ...extra }); }
      catch (e) { if (delegate === "CPU") throw e; }
    }
  };
  handLM = await make(HandLandmarker, "hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", { numHands: 2 });
  poseLM = await make(PoseLandmarker, "pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", { numPoses: 1 });
  msg.textContent = "커튼 사이로 들어가 보세요. 머리와 어깨 위로 줄이 걸쳐져요";
  setTimeout(() => { msg.textContent = ""; }, 5000);
}

function bodyFromPose(lm) {
  const P = i => ({ ...toScreen(lm[i]), v: lm[i].visibility ?? 1 });
  const ok = (...ids) => ids.every(i => (lm[i].visibility ?? 1) > 0.4);
  const out = [], K = BODY_SCALE;
  const cap = (a, b, r) => out.push({ ax: a.x, ay: a.y, bx: b.x, by: b.y, r: r * K });
  const el = P(7), er = P(8), ls = P(11), rs = P(12);
  const ear = Math.hypot(el.x - er.x, el.y - er.y), sw = Math.hypot(ls.x - rs.x, ls.y - rs.y);
  const hr = Math.max(30, ear * 0.9);
  const head = { x: (el.x + er.x) / 2, y: (el.y + er.y) / 2 - hr * 0.15 };
  cap(head, head, hr);                                            // 머리
  const sm = { x: (ls.x + rs.x) / 2, y: (ls.y + rs.y) / 2 };
  cap(head, sm, sw * 0.17);                                       // 목
  cap(ls, rs, sw * 0.2);                                          // 어깨
  const top = { x: sm.x, y: sm.y + sw * 0.25 };
  const bottom = ok(23, 24) ? { x: (P(23).x + P(24).x) / 2, y: (P(23).y + P(24).y) / 2 } : { x: sm.x, y: sm.y + sw * 2.5 };
  cap(top, bottom, sw * 0.42);                                    // 몸통
  if (ok(11, 13)) cap(ls, P(13), sw * 0.17);                      // 팔
  if (ok(12, 14)) cap(rs, P(14), sw * 0.17);
  if (ok(13, 15)) cap(P(13), P(15), sw * 0.14);
  if (ok(14, 16)) cap(P(14), P(16), sw * 0.14);
  return out;
}

function track() {
  if (!handLM || !poseLM || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const ts = performance.now(), list = [];
  const hands = handLM.detectForVideo(video, ts).landmarks || [];
  hands.forEach((lm, h) => {
    const a = toScreen(lm[0]), b = toScreen(lm[9]);
    const r = Math.max(30, Math.hypot(a.x - b.x, a.y - b.y) * HAND_RADIUS);
    HAND_POINTS.forEach(i => { const p = toScreen(lm[i]); list.push({ id: "h" + h + "_" + i, x: p.x, y: p.y, radius: r }); });
  });
  const poses = poseLM.detectForVideo(video, ts).landmarks || [];
  bodyShapes = poses.length ? bodyFromPose(poses[0]) : [];
  trackedPushers = list; refreshPushers();
}

/* ============ 시작 ============ */
const startEl = document.getElementById("start");
document.getElementById("btnMouse").onclick = () => { startEl.remove(); startAudio(); };
document.getElementById("btnCam").onclick = async () => {
  startEl.remove(); startAudio();
  try { await startCamera(); }
  catch (e) {
    console.error(e);
    msg.textContent = "카메라/인식을 켜지 못했어요. 마우스·터치로는 계속 쓸 수 있어요. (" + (e.name || e.message) + ")";
  }
};

function loop(now) { try { track(); } catch (e) { console.error(e); } step(); updateAudio(now); draw(); requestAnimationFrame(loop); }
addEventListener("resize", build);
build(); requestAnimationFrame(loop);
</script>
</body>
</html>
