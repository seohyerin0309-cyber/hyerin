<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>String Curtain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d10; color: #fff;
               font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  video { display: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 14px; background: rgba(40,36,32,.5); text-align: center; padding: 24px; }
  #start h1 { font-size: 20px; font-weight: 500; margin: 0 0 6px; letter-spacing: .02em; }
  #start p { margin: 0; font-size: 14px; opacity: .75; line-height: 1.6; }
  #start button { font: inherit; font-size: 16px; color: #fff; background: transparent; cursor: pointer;
                  border: 1px solid rgba(255,255,255,.8); border-radius: 999px; padding: 12px 28px; }
  #start button.sub { border-color: rgba(255,255,255,.3); font-size: 14px; padding: 9px 20px; opacity: .8; }
  #lightBtn { position: fixed; top: 12px; left: 12px; z-index: 5; font: inherit; font-size: 13px; color: #fff;
              background: rgba(40,36,32,.55); border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  #panel { position: fixed; top: 52px; left: 12px; z-index: 5; width: min(260px, calc(100vw - 24px)); box-sizing: border-box;
           padding: 12px 14px; border-radius: 14px; background: rgba(40,36,32,.7); color: #fff; font-size: 13px; }
  #panel label { display: block; margin-bottom: 10px; }
  #panel label span { float: right; opacity: .7; font-variant-numeric: tabular-nums; }
  #panel input { width: 100%; margin: 6px 0 0; }
  #msg { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 13px; opacity: .7;
         pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted></video>
<div id="start">
  <h1>String Curtain</h1>
  <p>카메라를 켜면 손과 얼굴이 줄커튼을 움직입니다.<br>영상은 이 기기 안에서만 처리되고 어디에도 저장·전송되지 않아요.</p>
  <button id="btnCam">카메라 켜기</button>
  <button id="btnMouse" class="sub">마우스/터치로만 해보기</button>
</div>
<button id="lightBtn">빛 조절</button>
<div id="panel" hidden></div>
<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============ 여기만 바꾸면 됩니다 ============ */

const STRING_SPACING = 200;    // 줄 사이 간격(px) — 클수록 듬성듬성
const LENGTH_RATIO   = 1.05;   // 줄 길이 (화면 높이의 몇 배, 1 이상이면 바닥까지)
const BG_COLOR       = "#d8d1c6";
const VIDEO_DIM      = 0.8;    // 카메라 영상 밝기 (0 = 안 보임, 1 = 원본)

// 조각 (큰 조각과 작은 조각이 번갈아 달려요)
const PIECE_BIG    = [58, 98];   // 큰 조각 크기 범위(px)
const PIECE_SMALL  = [24, 46];   // 작은 조각 크기 범위(px)
const PIECE_GAP    = 8;          // 조각 사이 실이 보이는 길이(px)
const PIECE_ALPHA  = 0.72;       // 투명도 (낮을수록 더 비쳐 보여요)
const THREAD_COLOR = "rgba(110,104,98,0.55)";   // 실 색
// 조각 색 [R, G, B] — 보라색 조개 껍데기 (짙은 보라 ~ 연한 라벤더)
const PALETTE = [
  [128,96,176], [146,114,190], [164,138,204], [182,160,218], [118,92,162], [154,124,182], [190,174,224],
];
// 뒤로 비치는 빛 색 — 햇빛이 유리 조각을 통과한 노랑·민트·분홍·푸른 보라
const LIGHT_COLORS = [[255,226,96], [104,214,226], [255,150,170], [140,150,245]];

// 색 빛 (슬라이더 시작값. 화면의 '빛 조절' 버튼에서 바꿀 수 있어요)
const LIGHT_DEFAULT = { alpha: 0.6,    // 빛 진하기 (0 ~ 1)
                        blur: 8,       // 가장자리 흐림(px)
                        gold: 0.18,    // 따뜻한 금빛 정도
                        follow: 0.08,  // 빛이 줄을 따라오는 속도 (낮을수록 느리고 부드러움)
                        move: 0.8 };   // 그림자가 조각을 따라 움직이는 거리 (1 = 조각과 같게)
const SHADOW_COUNT  = 7;           // 그림자를 만드는 조각 개수
const SHADOW_OFFSET = [28, 48];   // 그림자가 조각에서 떨어지는 방향·거리(px)
const HAND_SMOOTH  = 0.3;    // 손 떨림 줄이기 (낮을수록 부드럽지만 반응이 느려져요)

// 움직임 느낌 (무거운 조각은 천천히, 가벼운 조각은 빠르게 흔들려요)
const GRAVITY    = 0.25;   // 늘어지는 힘
const RETURN     = 0.012;  // 제자리로 돌아오려는 힘 (클수록 빨리 복귀)
const PUSH_POWER = 0.7;    // 밀어내는 세기
const PUSH_SWEEP = 0.4;    // 손이 움직이는 속도가 조각에 전달되는 정도

// 소리
const SOUND_ON     = true;
const SOUND_VOLUME = 0.12;                      // 0 ~ 1
const SCALE_HZ     = [262, 294, 330, 392, 440, 523, 587, 659, 784]; // 종소리 음계(도레미솔라...)
const CLICK_VOLUME = 0;                         // 조각 부딪히는 딸깍 소리 배율 (0이면 끔)

// 밀어내는 위치
const PUSH_RADIUS = 110;   // 마우스일 때 범위 반지름(px)
const HAND_RADIUS = 0.55;  // 손 크기 대비 범위 (클수록 넓게 밀어냄)
const BODY_SCALE  = 1.15;  // 몸 영역 크기 배율
const BODY_MARGIN = 6;     // 몸 둘레 여유(px)
const SHOW_BODY   = false; // true로 바꾸면 인식된 몸 영역(머리·어깨·팔)을 선으로 보여줘요

/* ============ 밀어내는 위치 ============ */
// 좌표는 화면(px). id가 같으면 이전 프레임과 비교해 이동 속도를 계산합니다.
let pushers = [];  // 예: [{ id: "a", x: 300, y: 400, radius: 110 }]
let mousePusher = null, trackedPushers = [];

function setPushers(list) {
  pushers = list.map(p => {
    const prev = pushers.find(q => q.id === p.id) || null;
    return { id: p.id, x: p.x, y: p.y, radius: p.radius || PUSH_RADIUS,
             vx: prev ? p.x - prev.x : 0, vy: prev ? p.y - prev.y : 0 };
  });
}
const refreshPushers = () => setPushers([...(mousePusher ? [mousePusher] : []), ...trackedPushers]);

const cv = document.getElementById("c");
cv.addEventListener("pointermove", e => { mousePusher = { id: "mouse", x: e.clientX, y: e.clientY }; refreshPushers(); });
cv.addEventListener("pointerdown", e => { mousePusher = { id: "mouse", x: e.clientX, y: e.clientY }; refreshPushers(); });
cv.addEventListener("pointerleave", () => { mousePusher = null; refreshPushers(); });
cv.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") { mousePusher = null; refreshPushers(); } });

/* ============ 조각 커튼 엔진 (건드리지 않아도 돼요) ============ */

const video = document.getElementById("cam");
const S = 2;   // 조각 그림을 2배 크기로 미리 그려 두어 선명하게
let W, H, strings = [], videoOn = false, energy = 0, hitX = 0.5, NOW = 0, clickBudget = 0;
let bodyShapes = [];   // 몸 영역: 캡슐(두 점 + 굵기) 목록, 화면 px. 조각이 이 안으로 들어가지 못해요.
let bodyHit = 0, casters = [];

// 조각 질감: 참고 사진(보라색 조개 조각)에서 잘라 온 4장. 내 사진으로 바꾸려면 아래 4개 주소를 교체하세요.

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const shade = (c, f) => c.map(v => Math.max(0, Math.min(255, Math.round(v * f))));

// 조각 모양 경로 (0,0이 중심)
function shapePath(c, type, w, h) {
  c.beginPath();
  if (type === "ring") {
    c.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2); c.closePath();
    c.moveTo(w * 0.23, 0); c.ellipse(0, 0, w * 0.23, h * 0.23, 0, 0, Math.PI * 2, true);
  } else if (type === "square") {
    const r = Math.min(w, h) * 0.28;
    c.moveTo(-w / 2 + r, -h / 2);
    c.arcTo(w / 2, -h / 2, w / 2, h / 2, r); c.arcTo(w / 2, h / 2, -w / 2, h / 2, r);
    c.arcTo(-w / 2, h / 2, -w / 2, -h / 2, r); c.arcTo(-w / 2, -h / 2, w / 2, -h / 2, r); c.closePath();
  } else c.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);   // disc, oval
}

/* ============ 3D 조각 (three.js) ============ */
let renderer = null, scene, camera, glGroup, discGeo, holeGeo, holeMat;
const matCache = {};
try { if (typeof THREE !== "undefined") renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), alpha: true, antialias: true }); } catch (e) { renderer = null; }
const USE_GL = !!renderer;   // 3D를 못 쓰는 기기에서는 평면 그림으로 대신 보여줘요
if (!USE_GL) document.getElementById("gl").style.display = "none";

function initGL() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(24, 1, 10, 20000);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6b5a80, 0.85));                    // 부드러운 전체 조명
  const key = new THREE.DirectionalLight(0xfff0dc, 1.15); key.position.set(-600, 700, 900); scene.add(key);   // 왼쪽 위 햇빛
  const fill = new THREE.DirectionalLight(0xbfa8ff, 0.35); fill.position.set(700, -300, 500); scene.add(fill);
  // 살짝 볼록한 원판(윗면·옆면·아랫면)을 한 번 만들어 모든 조각이 크기만 바꿔 씀
  const prof = [], N = 14, TH = 0.5, BULGE = 0.38;
  for (let i = 0; i <= N; i++) { const q = i / N; prof.push(new THREE.Vector2(q, TH + BULGE * (1 - q * q))); }
  for (let i = N; i >= 0; i--) { const q = i / N; prof.push(new THREE.Vector2(q, -(TH + BULGE * (1 - q * q)))); }
  discGeo = new THREE.LatheGeometry(prof, 48); discGeo.rotateX(Math.PI / 2);
  const pos = discGeo.attributes.position, uv = new Float32Array(pos.count * 2), col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), q = Math.hypot(x, y);
    uv[i * 2] = x * 0.5 + 0.5; uv[i * 2 + 1] = y * 0.5 + 0.5;                       // 사진을 위에서 내려다보듯 입힘
    const t = Math.min(1, Math.max(0, (q - 0.88) / 0.12)), f = 1 - 0.55 * t * t * (3 - 2 * t);   // 가장자리 단면은 어둡게
    col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = f;
  }
  discGeo.setAttribute("uv", new THREE.BufferAttribute(uv, 2)); discGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const hc = document.createElement("canvas"); hc.width = hc.height = 64; const h = hc.getContext("2d");   // 실 구멍
  h.fillStyle = "rgba(255,255,255,0.55)"; h.beginPath(); h.arc(32, 33, 17, 0, Math.PI * 2); h.fill();
  h.fillStyle = "rgba(24,12,34,1)"; h.beginPath(); h.arc(32, 32, 13, 0, Math.PI * 2); h.fill();
  holeMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(hc), transparent: true, depthWrite: false });
  holeGeo = new THREE.PlaneGeometry(7.5, 7.5);
}

function getMat(ti, rb, flip) {                         // 사진 4장 × 방향 8가지 × 좌우반전 = 필요한 만큼만 만들어 재사용
  const key = ti + "_" + rb + "_" + flip;
  if (matCache[key]) return matCache[key];
  const t = new THREE.Texture(TEX[ti]); t.needsUpdate = true; t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  const kk = [1.2, 1.2, 1.42, 1.25][ti];                // 사진 가장자리의 구슬·실 자국이 안 보이게 확대
  t.center.set(0.5, 0.5); t.rotation = rb * Math.PI / 4;
  t.repeat.set((flip ? -1 : 1) / kk, 1 / kk);          // 가운데를 기준으로 확대(+좌우반전)·회전
  return matCache[key] = new THREE.MeshPhysicalMaterial({ map: t, vertexColors: true, roughness: 0.32, metalness: 0.05,
    clearcoat: 1, clearcoatRoughness: 0.2, emissive: 0x20103a, emissiveIntensity: 0.25, side: THREE.DoubleSide });
}

function makeMesh(p) {
  const g = new THREE.Group(); g.rotation.order = "ZYX";
  const body = new THREE.Mesh(discGeo, getMat(Math.floor(Math.random() * TEX.length), Math.floor(Math.random() * 8), Math.random() < 0.5 ? 1 : 0));
  const zs = 3.2 + p.m * 0.9;                           // 무거운 조각일수록 두껍게
  body.scale.set(p.w / 2, p.h / 2, zs); g.add(body);
  const inset = Math.max(5, p.h * 0.12);
  for (const sg of [1, -1]) {
    const hy = sg * (p.h / 2 - inset), q = Math.abs(hy) / (p.h / 2);
    const m = new THREE.Mesh(holeGeo, holeMat); m.position.set(0, hy, (0.5 + 0.38 * (1 - q * q)) * zs + 0.2); g.add(m);
  }
  p.zo = Math.random() * 14; return g;
}

function syncMeshes(now) {
  for (const pts of strings) for (let i = 1; i < pts.length; i++) {
    const p = pts[i], a = pts[i - 1], b = pts[Math.min(i + 1, pts.length - 1)];
    const ang = Math.atan2(b.y - a.y, b.x - a.x) - Math.PI / 2 + p.sw + p.tilt;
    p.obj.position.set(p.x, H - p.y, p.zo);
    p.obj.rotation.set(Math.sin(now * 0.0007 + p.ph) * 0.1, p.yaw * 1.5, -ang);   // 세로축으로 도는 3D 회전
  }
}

// 보라색 조개 조각: 실제 사진 질감 + 두께·그림자·구멍을 얹어 입체감을 냄 (빛은 왼쪽 위에서)
function makeSprite(type, w, h, col) {
  const pad = 7, cw = Math.ceil((w + pad * 2) * S), ch = Math.ceil((h + pad * 2) * S);
  const cvs = document.createElement("canvas"); cvs.width = cw; cvs.height = ch;
  const c = cvs.getContext("2d");
  c.scale(S, S); c.translate(cw / S / 2, ch / S / 2);
  const dark = shade(col, 0.4);
  for (let t = 1; t <= 4; t++) {                                                                  // 두께(오른쪽 아래로 쌓인 단면)
    c.save(); c.translate(0.45 * t, 0.6 * t); shapePath(c, type, w, h);
    c.fillStyle = rgba(shade(col, 0.5 - t * 0.04), 0.95); c.fill(); c.restore();
  }
  c.save();
  shapePath(c, type, w, h); c.clip();
  c.fillStyle = rgba(col, 1); c.fillRect(-w, -h, w * 2, h * 2);
  const tex = pick(TEX);
  if (tex.complete && tex.naturalWidth) {
    c.save();
    if (type === "disc" && Math.random() < 0.7) c.rotate(rnd(0, Math.PI * 2));                    // 원판은 결 방향을 돌려서 다양하게
    if (Math.random() < 0.5) c.scale(-1, 1);
    const kk = type === "disc" ? 1.22 : 1.12;                                                     // 가장자리의 잡티는 잘라냄
    c.drawImage(tex, -w * kk / 2, -h * kk / 2, w * kk, h * kk);
    c.restore();
  }
  c.fillStyle = Math.random() < 0.5 ? `rgba(255,255,255,${rnd(0.02, 0.1)})` : `rgba(30,10,50,${rnd(0.02, 0.1)})`;   // 조각마다 살짝 다른 밝기
  c.fillRect(-w, -h, w * 2, h * 2);
  const vol = c.createLinearGradient(-w * 0.5, -h * 0.5, w * 0.5, h * 0.5);                       // 둥근 입체 음영
  vol.addColorStop(0, "rgba(255,255,255,0.2)"); vol.addColorStop(0.5, "rgba(255,255,255,0)"); vol.addColorStop(1, rgba(dark, 0.35));
  c.fillStyle = vol; c.fillRect(-w, -h, w * 2, h * 2);
  const rim = c.createLinearGradient(-w * 0.5, -h * 0.5, w * 0.5, h * 0.5);                       // 가장자리 두께감
  rim.addColorStop(0, "rgba(255,255,255,0.5)"); rim.addColorStop(0.45, "rgba(255,255,255,0.05)"); rim.addColorStop(1, rgba(dark, 0.55));
  c.strokeStyle = rim; c.lineWidth = 3.5; shapePath(c, type, w, h); c.stroke();
  c.restore();
  shapePath(c, type, w, h); c.strokeStyle = rgba(dark, 0.55); c.lineWidth = 0.7; c.stroke();      // 바깥 윤곽
  const inset = Math.max(5, h * 0.12);                                                            // 실이 지나가는 구멍 (위·아래)
  for (const y of [-h / 2 + inset, h / 2 - inset]) {
    c.save(); c.globalCompositeOperation = "destination-out"; c.beginPath(); c.arc(0, y, 2.3, 0, Math.PI * 2); c.fill(); c.restore();
    c.strokeStyle = rgba(dark, 0.8); c.lineWidth = 1; c.beginPath(); c.arc(0, y, 2.5, 0, Math.PI * 2); c.stroke();
    c.strokeStyle = "rgba(255,255,255,0.5)"; c.lineWidth = 0.6; c.beginPath(); c.arc(0.3, y + 0.5, 3.4, 0.2, Math.PI * 1.1); c.stroke();
  }
  return cvs;
}

function makePiece(big) {
  const size = big ? rnd(...PIECE_BIG) : rnd(...PIECE_SMALL);
  const type = Math.random() < 0.65 ? "disc" : "oval";
  let w = size * rnd(0.95, 1.05), h = size * rnd(0.95, 1.05);
  if (type === "oval") { w = size * 0.62 * rnd(0.95, 1.05); h = size * 1.35; }
  if (type === "square") { w = size * 0.92 * rnd(0.95, 1.05); h = size * 0.8; }
  const m = Math.max(0.5, Math.min(2.8, (w * h) / 2400)), k = 1 / m;     // 클수록 무겁다
  const col = pick(PALETTE);
  return { w, h, m, k, type, col, r: (w + h) / 4, ret: 0.5 + 0.5 * k, damp: 0.978 + 0.012 * (m / 2.8),
           sw: 0, last: 0, lsw: 0, yaw: 0, ph: rnd(0, 6.28), tilt: rnd(-0.08, 0.08), la: rnd(0.7, 1), sprite: USE_GL ? null : makeSprite(type, w, h, col) };
}

function build() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (USE_GL) {
    if (!scene) initGL();
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    const d = (H / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    camera.position.set(W / 2, H / 2, d); camera.lookAt(W / 2, H / 2, 0); camera.updateProjectionMatrix();
    if (glGroup) scene.remove(glGroup);
    glGroup = new THREE.Group(); scene.add(glGroup);
  }
  strings = [];
  const count = Math.max(3, Math.floor(W / STRING_SPACING));
  const x0 = (W - (count - 1) * STRING_SPACING) / 2;
  for (let s = 0; s < count; s++) {
    const x = x0 + s * STRING_SPACING;
    const pts = [{ x, y: -10, px: x, py: -10, rx: x, ry: -10, m: 1 }];      // 0번은 화면 밖 고정점
    let y = -10, prevH = 0;
    for (let i = 1; y < H * LENGTH_RATIO; i++) {
      const p = makePiece((i + s) % 2 === 0);
      const len = i === 1 ? p.h / 2 + 20 : prevH / 2 + p.h / 2 + PIECE_GAP;
      y += len; prevH = p.h;
      Object.assign(p, { x, y, px: x, py: y, rx: x, ry: y, len, lx: x, ly: y });
      if (USE_GL) { p.obj = makeMesh(p); glGroup.add(p.obj); }
      pts.push(p);
    }
    strings.push(pts);
  }
  casters = [];                                         // 그림자(색 빛)를 만드는 조각
  for (let n = 0; n < SHADOW_COUNT; n++) {
    const pts = strings[n % strings.length];
    const cand = pts.filter((p, i) => i > 0 && p.ry > H * 0.15 && p.ry < H * 0.8 && p.m > 1.2 && !casters.includes(p)
      && casters.every(q => q.rx !== p.rx || Math.abs(q.ry - p.ry) > 90));
    if (cand.length) { const q = pick(cand); q.c1 = LIGHT_COLORS[n % 4]; q.c2 = LIGHT_COLORS[(n + 1) % 4]; casters.push(q); }
  }
}

function tick(p, v) {
  if (NOW - p.last < 160 || clickBudget <= 0) return;
  p.last = NOW; clickBudget--; playClick(v, Math.max(p.w, p.h));
}

function collideBody(pts) {
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i];
    for (const c of bodyShapes) {
      const abx = c.bx - c.ax, aby = c.by - c.ay;
      let t = ((p.x - c.ax) * abx + (p.y - c.ay) * aby) / (abx * abx + aby * aby || 1);
      t = Math.max(0, Math.min(1, t));
      const qx = c.ax + abx * t, qy = c.ay + aby * t;
      const dx = p.x - qx, dy = p.y - qy, d = Math.hypot(dx, dy), R = c.r + BODY_MARGIN + p.r * 0.7;
      if (d < R) {
        const nx = d > 0.001 ? dx / d : 0, ny = d > 0.001 ? dy / d : -1;
        const sx = nx * (R - d), sy = ny * (R - d);
        p.x += sx; p.y += sy;
        p.px += sx; p.py += sy;                    // 속도는 유지 → 몸 표면을 타고 미끄러져요
        p.px += (p.x - p.px) * 0.25;               // 약간의 마찰
        p.py += (p.y - p.py) * 0.25;
        const hit = Math.min(Math.hypot(sx, sy), 6);
        bodyHit += hit;
        if (hit > 1.5) tick(p, hit * 0.12);
      }
    }
  }
}

function step(now) {
  NOW = now; clickBudget = 3;
  let e = 0, ex = 0; bodyHit = 0;
  for (const pts of strings) {
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], k = p.k;
      const sp0 = Math.hypot(p.x - p.px, p.y - p.py);
      let vx = (p.x - p.px) * p.damp, vy = (p.y - p.py) * p.damp;
      vy += GRAVITY;
      vx += (p.rx - p.x) * RETURN * p.ret;            // 가벼울수록 빨리 돌아와요
      vy += (p.ry - p.y) * RETURN * p.ret;
      for (const m of pushers) {
        const R = m.radius + p.r * 0.5;
        const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy);
        if (d < R && d > 0.01) {
          const f = Math.pow(1 - d / R, 2), sp = Math.hypot(m.vx, m.vy);
          vx += ((dx / d) * f * PUSH_POWER * 10 + m.vx * f * PUSH_SWEEP) * k;     // 가벼울수록 많이 밀려요
          vy += ((dy / d) * f * PUSH_POWER * 3  + m.vy * f * PUSH_SWEEP * 0.3) * k;
          if (d < R * 0.5) {
            const kk = (R * 0.5 - d) * 0.25;
            p.x += (dx / d) * kk; p.y += (dy / d) * kk * 0.3;
          }
          const w = f * sp * 0.12;
          e += w; ex += w * m.x;
          if (f > 0.25 && sp0 > 3.5) tick(p, sp0 * 0.08);                         // 손이 닿으면 딸깍
        }
      }
      p.px = p.x; p.py = p.y;
      p.x += vx;  p.y += vy;
      p.sw += (Math.max(-0.6, Math.min(0.6, vx * 0.06 * k)) - p.sw) * 0.12 * p.ret;  // 조각이 살짝 기울며 흔들림
      const ty3 = Math.max(-1.1, Math.min(1.1, vx * 0.14 * k)) + Math.sin(now * 0.0009 * (0.6 + k * 0.4) + p.ph) * 0.18;
      p.yaw += (ty3 - p.yaw) * 0.08 * p.ret;                                          // 세로축으로 돌아가며 입체적으로 흔들림
    }
    for (let it = 0; it < 10; it++) {
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const diff = (d - b.len) / d;
        if (i === 1) { b.x -= dx * diff; b.y -= dy * diff; }
        else {
          const wa = 1 / a.m, wb = 1 / b.m, sum = wa + wb;          // 무거운 쪽이 덜 움직임
          a.x += dx * diff * wa / sum; a.y += dy * diff * wa / sum;
          b.x -= dx * diff * wb / sum; b.y -= dy * diff * wb / sum;
        }
      }
      if (bodyShapes.length) collideBody(pts);
    }
  }
  for (let s = 0; s < strings.length - 1; s++) {                    // 옆 줄 조각끼리 부딪힘
    const A = strings[s], B = strings[s + 1];
    for (let i = 1; i < A.length; i++) for (let j = 1; j < B.length; j++) {
      const a = A[i], b = B[j];
      if (Math.abs(a.y - b.y) > 80) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = (a.r + b.r) * 0.5;
      if (d < min && d > 0.01) {
        const ov = (min - d) / d, wa = 1 / a.m, wb = 1 / b.m, sum = wa + wb;
        const rv = Math.hypot((a.x - a.px) - (b.x - b.px), (a.y - a.py) - (b.y - b.py));
        a.x -= dx * ov * 0.2 * wa / sum; a.y -= dy * ov * 0.2 * wa / sum;
        b.x += dx * ov * 0.2 * wb / sum; b.y += dy * ov * 0.2 * wb / sum;
        if (rv > 2.2) { tick(a, rv * 0.08); tick(b, rv * 0.08); }
      }
    }
  }
  e += bodyHit * 0.04;
  energy = Math.min(e, 12); if (e > 0) hitX = ex / e / W;
  for (const m of pushers) { m.vx *= 0.8; m.vy *= 0.8; }
}

function drawVideo() {
  if (!videoOn || video.readyState < 2) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh);
  ctx.save();
  ctx.globalAlpha = VIDEO_DIM;
  ctx.translate(W, 0); ctx.scale(-1, 1);              // 거울처럼 좌우 반전
  ctx.drawImage(video, (W - vw * s) / 2, (H - vh * s) / 2, vw * s, vh * s);
  ctx.restore();
}


/* ============ 색 빛 (조각을 통과한 햇빛이 얼굴·몸 위에 비침) ============ */
const LIGHT = { ...LIGHT_DEFAULT };
try { Object.assign(LIGHT, JSON.parse(localStorage.getItem("curtainLight") || "{}")); } catch (e) {}
const SLIDERS = [["alpha", "빛 투명도", 0, 1, 0.01], ["blur", "가장자리 흐림", 0, 24, 1], ["gold", "금빛 정도", 0, 0.4, 0.01],
                 ["follow", "따라오는 속도", 0.01, 0.3, 0.01], ["move", "이동 거리", 0, 1, 0.01]];
const panel = document.getElementById("panel");
SLIDERS.forEach(([key, name, min, max, stepv]) => {
  const lab = document.createElement("label"), val = document.createElement("span"), inp = document.createElement("input");
  inp.type = "range"; inp.min = min; inp.max = max; inp.step = stepv; inp.value = LIGHT[key]; val.textContent = LIGHT[key];
  inp.oninput = () => { LIGHT[key] = +inp.value; val.textContent = inp.value;
    try { localStorage.setItem("curtainLight", JSON.stringify(LIGHT)); } catch (e) {} };
  lab.append(name, val, inp); panel.append(lab);
});
document.getElementById("lightBtn").onclick = () => { panel.hidden = !panel.hidden; };

const mk = () => document.createElement("canvas");
const lc = mk(), lf = mk();                                 // 색 그림자 / 얼굴 쪽 그림자 (작게 그려서 부드럽게)
const LS = 0.4, canFilter = "filter" in ctx;
let face = { x: 0, y: 0, r: 100, w: 0 }, faceT = null, faceOn = 0;

function updateLight(now) {
  const dx = Math.sin(now * 0.0003) * 6, dy = Math.cos(now * 0.00025) * 4;      // 햇빛의 아주 느린 흔들림
  for (const p of casters) {
    const tx = p.rx + (p.x - p.rx) * LIGHT.move + SHADOW_OFFSET[0] + dx;        // 조각을 따라가는 그림자 위치
    const ty = p.ry + (p.y - p.ry) * LIGHT.move + SHADOW_OFFSET[1] + dy;
    if (p.lx === undefined || p.lx === p.x) { p.lx = tx; p.ly = ty; }
    p.lx += (tx - p.lx) * LIGHT.follow; p.ly += (ty - p.ly) * LIGHT.follow;     // 조각보다 느리고 부드럽게 따라옴
    p.lsw += (p.sw * LIGHT.move - p.lsw) * LIGHT.follow;
  }
  if (faceT) {
    if (face.w < 0.02) { face.x = faceT.x; face.y = faceT.y; }
    face.x += (faceT.x - face.x) * 0.12; face.y += (faceT.y - face.y) * 0.12; face.r += (faceT.r - face.r) * 0.12;
  }
  face.w += (faceOn - face.w) * 0.06;
}

function lightShape(c, p) {
  c.save(); c.translate(p.lx * LS, p.ly * LS); c.rotate(0.5 + p.lsw); c.scale(LS * 1.3, LS * 1.9);   // 햇빛이 비스듬히 늘어져 바닥에 닿은 모양
  shapePath(c, p.type, p.w, p.h); c.restore();
}

function drawLight() {
  if (!casters.length) return;
  const lw = Math.ceil(W * LS), lh = Math.ceil(H * LS);
  for (const c of [lc, lf]) if (c.width !== lw || c.height !== lh) { c.width = lw; c.height = lh; }
  const cc = lc.getContext("2d"), fc = lf.getContext("2d");
  cc.clearRect(0, 0, lw, lh);                                  // 조각 색에 맞춘 연한 파스텔 그림자
  for (const p of casters) {
    lightShape(cc, p);
    const R = Math.max(p.w, p.h) * LS * 0.6;
    const g = cc.createLinearGradient(p.lx * LS - R, p.ly * LS - R, p.lx * LS + R, p.ly * LS + R);   // 두 색이 번지는 무지개빛
    g.addColorStop(0, rgba(p.c1, 1)); g.addColorStop(1, rgba(p.c2, 1));
    cc.fillStyle = g; cc.fill();
  }
  if (face.w > 0.02) {                                         // 얼굴 쪽에 조금 더 진하게
    fc.globalCompositeOperation = "source-over"; fc.clearRect(0, 0, lw, lh); fc.drawImage(lc, 0, 0);
    const g = fc.createRadialGradient(face.x * LS, face.y * LS, 0, face.x * LS, face.y * LS, face.r * LS);
    g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
    fc.globalCompositeOperation = "destination-in"; fc.fillStyle = g; fc.fillRect(0, 0, lw, lh);
  }
  const A = LIGHT.alpha;
  ctx.save(); ctx.imageSmoothingEnabled = true;
  if (canFilter) ctx.filter = `blur(${LIGHT.blur * 1.8}px)`;                  // 1) 번지는 빛무리
  ctx.globalCompositeOperation = "screen"; ctx.globalAlpha = Math.min(1, A * 0.55); ctx.drawImage(lc, 0, 0, W, H);
  if (canFilter) ctx.filter = LIGHT.blur > 0 ? `blur(${Math.max(0.5, LIGHT.blur * 0.3)}px)` : "none";   // 2) 선명한 색 조각
  ctx.globalCompositeOperation = "multiply"; ctx.globalAlpha = Math.min(1, A); ctx.drawImage(lc, 0, 0, W, H);
  if (face.w > 0.02) { ctx.globalAlpha = Math.min(1, A * 0.7 * face.w); ctx.drawImage(lf, 0, 0, W, H); }
  ctx.restore();
  if (LIGHT.gold > 0) {                                        // 따뜻한 저녁 햇빛 톤
    ctx.save(); ctx.globalCompositeOperation = "soft-light";
    ctx.fillStyle = `rgba(255,170,85,${Math.min(1, LIGHT.gold * 2)})`; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

function draw() {
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, W, H);
  drawVideo();
  drawLight();
  ctx.strokeStyle = THREAD_COLOR; ctx.lineWidth = 1;     // 실
  ctx.beginPath();
  for (const pts of strings) { ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); }
  ctx.stroke();
  for (const pts of strings) {                           // 조각
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], a = pts[i - 1], b = pts[Math.min(i + 1, pts.length - 1)];
      const ang = Math.atan2(b.y - a.y, b.x - a.x) - Math.PI / 2 + p.sw + p.tilt;
      ctx.save();
      if (USE_GL) {                                      // 3D 조각 아래에 깔리는 부드러운 그림자
        ctx.translate(p.x + 8, p.y + 11); ctx.rotate(ang); ctx.scale(Math.max(0.38, Math.cos(p.yaw * 1.5)), 1);
        ctx.fillStyle = "rgba(30,15,50,0.13)"; ctx.beginPath(); ctx.ellipse(0, 0, p.w / 2, p.h / 2, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.translate(p.x, p.y); ctx.rotate(ang); ctx.scale(Math.max(0.38, Math.cos(p.yaw)), 1);
        ctx.drawImage(p.sprite, -p.sprite.width / S / 2, -p.sprite.height / S / 2, p.sprite.width / S, p.sprite.height / S);
      }
      ctx.restore();
    }
  }
  if (SHOW_BODY) {
    ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineCap = "round";
    for (const c of bodyShapes) { ctx.lineWidth = c.r * 2; ctx.beginPath(); ctx.moveTo(c.ax, c.ay); ctx.lineTo(c.bx, c.by); ctx.stroke(); }
  }
}

/* ============ 소리 ============ */
let ac = null, noiseGain, noiseFilter, lastChime = 0;
function startAudio() {
  if (!SOUND_ON || ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    noiseFilter = ac.createBiquadFilter(); noiseFilter.type = "bandpass"; noiseFilter.Q.value = 0.8; noiseFilter.frequency.value = 1500;
    noiseGain = ac.createGain(); noiseGain.gain.value = 0;
    src.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ac.destination);
    src.start();
  } catch (e) { ac = null; }
}
function updateAudio(now) {
  if (!ac) return;
  const t = ac.currentTime;
  noiseGain.gain.setTargetAtTime(Math.min(0.06, energy * 0.004) * SOUND_VOLUME * 2, t, 0.06);   // 스르륵 천 스치는 소리
  noiseFilter.frequency.setTargetAtTime(900 + Math.min(energy, 20) * 130, t, 0.08);
  if (energy > 5 && now - lastChime > 600) {                                                   // 가끔 울리는 맑은 종소리
    lastChime = now;
    const f = SCALE_HZ[Math.min(SCALE_HZ.length - 1, Math.floor(hitX * SCALE_HZ.length))];
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.10 * SOUND_VOLUME, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 1.7);
  }
}

function playClick(v, size) {                          // 맑고 마른 딸깍
  if (!ac || CLICK_VOLUME <= 0) return;
  const t = ac.currentTime, vol = Math.min(1, v) * SOUND_VOLUME * CLICK_VOLUME;
  const f = Math.max(1400, Math.min(3400, 3600 - size * 18)) + Math.random() * 200;   // 작을수록 높은 소리
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.8, t + 0.05);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.001); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.08);
  const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.03), ac.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const ns = ac.createBufferSource(); ns.buffer = nb;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f * 1.5; bp.Q.value = 3;
  const ng = ac.createGain(); ng.gain.value = vol * 0.8;
  ns.connect(bp); bp.connect(ng); ng.connect(ac.destination); ns.start(t);
}

/* ============ 손·얼굴 인식 (MediaPipe) ============ */
const msg = document.getElementById("msg");
let handSm = new Map(), handLM = null, poseLM = null, lastVideoTime = -1;
const HAND_POINTS = [0, 4, 8, 12, 16, 20, 5, 9, 13, 17];

function toScreen(lm) {                                 // 영상 좌표(0~1) → 화면 px (거울 + cover)
  const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh);
  return { x: (W - vw * s) / 2 + (1 - lm.x) * vw * s, y: (H - vh * s) / 2 + lm.y * vh * s };
}

async function startCamera() {
  msg.textContent = "카메라 여는 중…";
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
  video.srcObject = stream; await video.play(); videoOn = true;
  msg.textContent = "손과 얼굴 인식 준비 중…";
  const V = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const { FilesetResolver, HandLandmarker, PoseLandmarker } = await import(V + "/vision_bundle.mjs");
  const files = await FilesetResolver.forVisionTasks(V + "/wasm");
  const M = "https://storage.googleapis.com/mediapipe-models/";
  const make = async (Cls, path, extra) => {
    for (const delegate of ["GPU", "CPU"]) {
      try { return await Cls.createFromOptions(files, { baseOptions: { modelAssetPath: M + path, delegate }, runningMode: "VIDEO", ...extra }); }
      catch (e) { if (delegate === "CPU") throw e; }
    }
  };
  handLM = await make(HandLandmarker, "hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", { numHands: 2 });
  poseLM = await make(PoseLandmarker, "pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", { numPoses: 1 });
  msg.textContent = "커튼 사이로 들어가 보세요. 머리와 어깨 위로 줄이 걸쳐져요";
  setTimeout(() => { msg.textContent = ""; }, 5000);
}

function bodyFromPose(lm) {
  const P = i => ({ ...toScreen(lm[i]), v: lm[i].visibility ?? 1 });
  const ok = (...ids) => ids.every(i => (lm[i].visibility ?? 1) > 0.4);
  const out = [], K = BODY_SCALE;
  const cap = (a, b, r) => out.push({ ax: a.x, ay: a.y, bx: b.x, by: b.y, r: r * K });
  const el = P(7), er = P(8), ls = P(11), rs = P(12);
  const ear = Math.hypot(el.x - er.x, el.y - er.y), sw = Math.hypot(ls.x - rs.x, ls.y - rs.y);
  const hr = Math.max(30, ear * 0.9);
  const head = { x: (el.x + er.x) / 2, y: (el.y + er.y) / 2 - hr * 0.15 };
  cap(head, head, hr);                                            // 머리
  const sm = { x: (ls.x + rs.x) / 2, y: (ls.y + rs.y) / 2 };
  cap(head, sm, sw * 0.17);                                       // 목
  cap(ls, rs, sw * 0.2);                                          // 어깨
  const top = { x: sm.x, y: sm.y + sw * 0.25 };
  const bottom = ok(23, 24) ? { x: (P(23).x + P(24).x) / 2, y: (P(23).y + P(24).y) / 2 } : { x: sm.x, y: sm.y + sw * 2.5 };
  cap(top, bottom, sw * 0.42);                                    // 몸통
  if (ok(11, 13)) cap(ls, P(13), sw * 0.17);                      // 팔
  if (ok(12, 14)) cap(rs, P(14), sw * 0.17);
  if (ok(13, 15)) cap(P(13), P(15), sw * 0.14);
  if (ok(14, 16)) cap(P(14), P(16), sw * 0.14);
  return out;
}

function track() {
  if (!handLM || !poseLM || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const ts = performance.now(), list = [], nextSm = new Map();
  const hands = handLM.detectForVideo(video, ts).landmarks || [];
  hands.forEach((lm, h) => {
    const a = toScreen(lm[0]), b = toScreen(lm[9]);
    const r = Math.max(30, Math.hypot(a.x - b.x, a.y - b.y) * HAND_RADIUS);
    HAND_POINTS.forEach(i => {
      const p = toScreen(lm[i]), id = "h" + h + "_" + i, q = handSm.get(id);
      let x = p.x, y = p.y;
      if (q) { const al = Math.min(0.8, HAND_SMOOTH + Math.hypot(p.x - q.x, p.y - q.y) * 0.02); x = q.x + (p.x - q.x) * al; y = q.y + (p.y - q.y) * al; }
      nextSm.set(id, { x, y }); list.push({ id, x, y, radius: r });
    });
  });
  handSm = nextSm;
  const poses = poseLM.detectForVideo(video, ts).landmarks || [];
  bodyShapes = poses.length ? bodyFromPose(poses[0]) : [];
  if (poses.length) {
    const a = toScreen(poses[0][7]), b = toScreen(poses[0][8]);
    faceT = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, r: Math.max(70, Math.hypot(a.x - b.x, a.y - b.y) * 1.8) }; faceOn = 1;
  } else faceOn = 0;
  trackedPushers = list; refreshPushers();
}

/* ============ 시작 ============ */
const startEl = document.getElementById("start");
document.getElementById("btnMouse").onclick = () => { startEl.remove(); startAudio(); };
document.getElementById("btnCam").onclick = async () => {
  startEl.remove(); startAudio();
  try { await startCamera(); }
  catch (e) {
    console.error(e);
    msg.textContent = "카메라/인식을 켜지 못했어요. 마우스·터치로는 계속 쓸 수 있어요. (" + (e.name || e.message) + ")";
  }
};

function loop(now) { try { track(); } catch (e) { console.error(e); } step(now); updateLight(now); updateAudio(now); draw(); if (USE_GL) { syncMeshes(now); renderer.render(scene, camera); } requestAnimationFrame(loop); }
addEventListener("resize", build);
Promise.all(TEX.map(i => i.decode().catch(() => {}))).then(() => { build(); requestAnimationFrame(loop); });
</script>
