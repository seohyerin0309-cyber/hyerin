<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lantern Cord</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0907; color: #fff;
               font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
         transform: scaleX(-1); filter: brightness(.5) saturate(.85) contrast(1.05); }
  #light { position: fixed; inset: 0; mix-blend-mode: screen; pointer-events: none; }
  #light .layer { position: absolute; inset: 0; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%); }
  #gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
  #hint { position: fixed; left: 0; right: 0; bottom: 56px; text-align: center; font-size: 14px;
          letter-spacing: .02em; opacity: .85; text-shadow: 0 1px 8px rgba(0,0,0,.6); padding: 0 16px; }
  #dots { position: fixed; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; gap: 10px; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.3); transition: all .5s; }
  #dots i.on { background: #fff; transform: scale(1.35); box-shadow: 0 0 10px rgba(255,255,255,.8); }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 14px; background: rgba(20,14,10,.72); text-align: center; padding: 24px; z-index: 10; }
  #start h1 { font-size: 20px; font-weight: 500; margin: 0 0 6px; }
  #start p { margin: 0; font-size: 14px; opacity: .75; line-height: 1.7; }
  #start button { font: inherit; font-size: 16px; color: #fff; background: transparent; cursor: pointer;
                  border: 1px solid rgba(255,255,255,.8); border-radius: 999px; padding: 12px 28px; }
  #start button.sub { border-color: rgba(255,255,255,.3); font-size: 14px; padding: 9px 20px; opacity: .8; }
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<div id="light"></div>
<div id="vignette"></div>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="hint"></div>
<div id="dots"><i class="on"></i><i></i><i></i><i></i></div>
<div id="start">
  <h1>Lantern Cord</h1>
  <p>검지와 중지를 붙이면 위에서 줄이 내려와요.<br>줄을 잡은 채 아래로 딸깍 당기면 빛이 퍼집니다.</p>
  <button id="go">카메라 켜고 시작</button>
  <button id="nocam" class="sub">카메라 없이 마우스로 체험</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const $ = (s) => document.querySelector(s);
const video = $('#cam'), glCanvas = $('#gl'), hud = $('#hud'), hctx = hud.getContext('2d');
const hint = $('#hint'), lightEl = $('#light'), dots = [...document.querySelectorAll('#dots i')];

/* ---------------- light stages (이미지 1~4의 빛) ---------------- */
const STAGES = [
  { name: '주황 펜던트', fabric: 0xffb070, halo: 0xff9a4a,
    bg: (x, y) => `radial-gradient(ellipse 75% 85% at ${x}px ${y}px, rgba(255,150,60,.55), rgba(255,110,40,.26) 45%, rgba(120,50,20,.14) 100%)` },
  { name: '핑크 종이등', fabric: 0xffa4ae, halo: 0xff8099,
    bg: (x, y) => `radial-gradient(ellipse 85% 95% at ${x}px ${y}px, rgba(255,150,175,.6), rgba(255,120,150,.3) 50%, rgba(150,60,90,.18) 100%)` },
  { name: '노을 침실', fabric: 0xffbc88, halo: 0xffc23c,
    bg: (x, y) => `radial-gradient(circle 55vmax at 82% 58%, rgba(255,215,40,.6), rgba(255,170,40,.2) 55%, transparent 75%),
                   radial-gradient(ellipse 80% 90% at ${x}px ${y}px, rgba(255,150,130,.5), rgba(220,110,100,.24) 60%, rgba(120,60,50,.14) 100%)` },
  { name: '보라 라운지', fabric: 0xe6a2ff, halo: 0xc062ff,
    bg: (x, y) => `radial-gradient(ellipse 60% 22% at 50% 78%, rgba(255,190,90,.38), transparent 70%),
                   radial-gradient(ellipse 85% 95% at ${x}px ${y}px, rgba(255,120,230,.55), rgba(190,80,230,.3) 50%, rgba(90,30,120,.25) 100%)` },
];
let stage = 0;

/* ---------------- three.js ---------------- */
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: true });
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const FOV = 35, CAM_Z = 12;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
camera.position.z = CAM_Z;
const HALF_H = Math.tan(THREE.MathUtils.degToRad(FOV / 2)) * CAM_Z;   // 화면 절반 높이(월드)
let halfW = HALF_H, clusterX = 0, SW = 1, SH = 1;

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dl = new THREE.DirectionalLight(0xffe2c0, 1.6); dl.position.set(2, 4, 6); scene.add(dl);

/* 린넨 질감 텍스처 */
function weaveTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 256; i += 2) {
    g.fillStyle = `rgba(90,50,20,${0.05 + Math.random() * 0.08})`; g.fillRect(0, i, 256, 1);
    g.fillStyle = `rgba(90,50,20,${0.05 + Math.random() * 0.08})`; g.fillRect(i, 0, 1, 256);
  }
  for (let i = 0; i < 500; i++) {                       // 슬럽(굵은 올)
    g.strokeStyle = `rgba(110,70,40,${Math.random() * 0.14})`;
    g.lineWidth = 1 + Math.random();
    const x = Math.random() * 256, y = Math.random() * 256, l = 8 + Math.random() * 26;
    g.beginPath(); g.moveTo(x, y); Math.random() < .5 ? g.lineTo(x + l, y) : g.lineTo(x, y + l); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(14, 5); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const weave = weaveTexture();

function glowTexture(inner = 0.0) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), r = g.createRadialGradient(128, 128, inner * 128, 128, 128, 128);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.55)');
  r.addColorStop(.6, 'rgba(255,255,255,.14)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const haloTex = glowTexture(), bulbTex = glowTexture();

/* 호박 모양 리브 랜턴: 12개 리브 사이로 천이 부풀고, 윗부분은 물결 */
const N_RIB = 12;
function surfacePoint(t, ph, W, H, out) {
  const st = Math.sin(t), ct = Math.cos(t);
  const s = Math.abs(Math.sin(N_RIB / 2 * ph));                    // 리브 위에서 0
  const pinch = 1 - 0.13 * (1 - Math.pow(s, 0.6)) * Math.pow(st, 0.7);
  const r = (W / 2) * Math.pow(st, 0.72) * pinch;
  let y = (H / 2) * Math.sign(ct) * Math.pow(Math.abs(ct), 0.85);
  y += Math.sign(ct) * H * (0.035 * Math.cos(N_RIB * ph) * Math.pow(st, 3) - 0.04 * (1 - st));
  out[0] = r * Math.cos(ph); out[1] = y; out[2] = r * Math.sin(ph);
  return s;
}
function lanternGeometry(W, H) {
  const nu = N_RIB * 8, nv = 56, p = [0, 0, 0];
  const pos = [], uv = [], col = [], idx = [];
  for (let j = 0; j <= nv; j++) {
    const t = j / nv * Math.PI, ct = Math.abs(Math.cos(t));
    for (let i = 0; i <= nu; i++) {
      const ph = i / nu * Math.PI * 2;
      const s = surfacePoint(t, ph, W, H, p);
      pos.push(p[0], p[1], p[2]); uv.push(i / nu, j / nv);
      const b = Math.min(1, 0.8 + 0.2 * Math.pow(s, 0.8) + 0.25 * Math.pow(ct, 8));   // 리브 근처는 살짝 진하게, 극점은 밝게
      col.push(b, b * (0.88 + 0.12 * s), b * (0.78 + 0.22 * s));
    }
  }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = j * (nu + 1) + i, b = a + nu + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  return g;
}

const ribMat = new THREE.MeshStandardMaterial({ color: 0x4a3a35, roughness: .6, metalness: .3 });
const capMat = new THREE.MeshStandardMaterial({ color: 0xc9a36a, roughness: .35, metalness: .8 });
const ropeMat = new THREE.MeshBasicMaterial({ color: 0xf2e6d4 });
const fabricCol = new THREE.Color(STAGES[0].fabric), haloCol = new THREE.Color(STAGES[0].halo);
const fabricMat = new THREE.MeshBasicMaterial({ map: weave, vertexColors: true, color: fabricCol, side: THREE.DoubleSide });

// 이미지 1처럼 세로로 매달린 3개 (중심 y, 폭, 높이, x오프셋)
const DEFS = [
  { cy: 1.75, W: 3.1, H: 1.75, dx: 0.0 },
  { cy: -0.35, W: 2.4, H: 1.3, dx: 0.35 },
  { cy: -2.35, W: 2.15, H: 1.15, dx: -0.3 },
];
const PIVOT_Y = HALF_H + 1.2;
const lanterns = DEFS.map((d, i) => {
  const pivot = new THREE.Group(); scene.add(pivot);
  const body = new THREE.Group(); body.position.y = d.cy - PIVOT_Y; pivot.add(body);
  body.add(new THREE.Mesh(lanternGeometry(d.W, d.H), fabricMat));

  const p = [0, 0, 0];
  for (let k = 0; k < N_RIB; k++) {                           // 가는 금속 리브
    const ph = k / N_RIB * Math.PI * 2, pts = [];
    for (let j = 1; j < 40; j++) { surfacePoint(j / 40 * Math.PI, ph, d.W, d.H, p); pts.push(new THREE.Vector3(p[0] * 1.004, p[1], p[2] * 1.004)); }
    body.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.011 * d.W / 2.4, 5), ribMat));
  }
  for (const sgn of [1, -1]) {                                // 위·아래 금속 캡
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(d.W * 0.05, d.W * 0.065, d.H * 0.07, 20), capMat);
    cap.position.y = sgn * (d.H / 2 - d.H * 0.03); body.add(cap);
  }
  const ropeLen = PIVOT_Y - (d.cy + d.H / 2);
  const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, ropeLen, 6), ropeMat);
  rope.position.y = d.cy + d.H / 2 - PIVOT_Y + ropeLen / 2; pivot.add(rope);

  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: haloCol, blending: THREE.AdditiveBlending, transparent: true, opacity: .6, depthWrite: false }));
  halo.scale.set(d.W * 2.3, d.W * 2.0, 1); halo.position.set(0, 0, -0.8); body.add(halo);
  const bulb = new THREE.Sprite(new THREE.SpriteMaterial({ map: bulbTex, color: 0xfff0c8, blending: THREE.AdditiveBlending, transparent: true, opacity: .85, depthTest: false, depthWrite: false }));
  bulb.scale.set(d.W * 0.5, d.W * 0.5, 1); bulb.position.set(0, 0, 0.2); body.add(bulb);

  return { pivot, d, halo, bulb, ang: 0, vel: 0, phase: i * 1.7 };
});

/* 당김 줄 */
const cordGroup = new THREE.Group(); scene.add(cordGroup);
const TOP_Y = HALF_H + 1.5;
const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1, 8), ropeMat); cordGroup.add(cord);
const handle = new THREE.Group(); cordGroup.add(handle);
const bead = new THREE.Mesh(new THREE.SphereGeometry(0.15, 24, 16), new THREE.MeshStandardMaterial({ color: 0xe8c9a0, roughness: .5 }));
const tassel = new THREE.Mesh(new THREE.CapsuleGeometry(0.065, 0.42, 6, 12), new THREE.MeshStandardMaterial({ color: 0xd9b585, roughness: .55 }));
tassel.position.y = -0.34; handle.add(bead, tassel);
cordGroup.visible = false;

/* ---------------- 빛 퍼짐 오버레이 ---------------- */
function clusterScreen() {
  const v = new THREE.Vector3(clusterX, 0.3, 0).project(camera);
  return [(v.x + 1) / 2 * SW, (1 - v.y) / 2 * SH];
}
let layers = [];
function setLightLayer(i, animate) {
  const [x, y] = clusterScreen();
  const el = document.createElement('div'); el.className = 'layer';
  el.style.background = STAGES[i].bg(x, y);
  lightEl.appendChild(el);
  const prev = layers.slice();
  layers.push(el);
  if (!animate) { prev.forEach(l => l.remove()); layers = [el]; return; }
  const R = Math.hypot(Math.max(x, SW - x), Math.max(y, SH - y)) + SW * 0.25, t0 = performance.now(), dur = 1900;
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3), r = e * R;
    const m = `radial-gradient(circle at ${x}px ${y}px, #000 ${r}px, transparent ${r + SW * 0.22}px)`;
    el.style.webkitMaskImage = m; el.style.maskImage = m;
    if (k < 1) requestAnimationFrame(step);
    else { prev.forEach(l => l.remove()); layers = [el]; el.style.webkitMaskImage = el.style.maskImage = 'none'; }
  };
  el.style.webkitMaskImage = el.style.maskImage = `radial-gradient(circle at ${x}px ${y}px, #000 0px, transparent 0px)`;
  requestAnimationFrame(step);
}

/* 딸깍 소리 */
let actx = null;
function clickSound() {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(1900, t); o.frequency.exponentialRampToValueAtTime(380, t + .04);
  g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .08);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .09);
}

function nextStage() {
  stage = (stage + 1) % STAGES.length;
  setLightLayer(stage, true);
  dots.forEach((d, i) => d.classList.toggle('on', i === stage));
  hint.textContent = `${stage + 1}번째 빛 · ${STAGES[stage].name}`;
  lanterns.forEach((l, i) => { l.vel += 0.5 + i * 0.12; });
  bounce = 0.4; clickSound();
}

/* ---------------- 입력: 손(MediaPipe) / 마우스 ---------------- */
const hand = { x: 0, y: 0, pinch: false, seen: 0, has: false };
const mouse = { x: 0, y: 0, down: false };
let landmarker = null, lastVT = -1;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function mapLM(lm) {                                           // object-fit: cover + 거울 반전
  const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(SW / vw, SH / vh);
  const dw = vw * s, dh = vh * s;
  return { x: SW - (lm.x * dw + (SW - dw) / 2), y: lm.y * dh + (SH - dh) / 2 };
}
function processHand(res, now) {
  if (!res.landmarks.length) { if (now - hand.seen > 250) { hand.has = false; hand.pinch = false; } return; }
  const lm = res.landmarks[0], vw = video.videoWidth, vh = video.videoHeight;
  const P = (i) => ({ x: lm[i].x * vw, y: lm[i].y * vh });
  const palm = dist(P(0), P(9));
  const tipD = dist(P(8), P(12)) / palm;
  const ext = (tip, pip) => dist(P(0), P(tip)) > dist(P(0), P(pip)) * 1.08;     // 손가락이 펴져 있는지
  const extended = ext(8, 6) && ext(12, 10);
  const a = mapLM(lm[8]), b = mapLM(lm[12]);
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  hand.x = hand.has ? hand.x + (mx - hand.x) * 0.6 : mx;
  hand.y = hand.has ? hand.y + (my - hand.y) * 0.6 : my;
  hand.has = true; hand.seen = now;
  hand.pinch = hand.pinch ? (tipD < 0.55 && extended) : (tipD < 0.34 && extended);   // 히스테리시스
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1280, height: 720 }, audio: false });
  video.srcObject = stream; await video.play();
  hint.textContent = '손 인식 모델 불러오는 중…';
  const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const base = { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' };
  const opts = { runningMode: 'VIDEO', numHands: 1, minHandDetectionConfidence: .5, minTrackingConfidence: .5 };
  try { landmarker = await HandLandmarker.createFromOptions(fileset, { ...opts, baseOptions: { ...base, delegate: 'GPU' } }); }
  catch { landmarker = await HandLandmarker.createFromOptions(fileset, { ...opts, baseOptions: base }); }
}

addEventListener('pointerdown', (e) => { if ($('#start').style.display !== 'none') return; mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('pointermove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('pointerup', () => { mouse.down = false; });

/* ---------------- 줄 상태 머신 ---------------- */
let cordX = 0, handleY = TOP_Y, grabbed = false, armed = true, refY = 0, clickY = 0, bounce = 0, wasPinch = false;
const PULL_DIST = 0.85;                                         // 이만큼 내리면 '딸깍'

function toWorld(px, py) { return [(px / SW * 2 - 1) * halfW, (1 - py / SH * 2) * HALF_H]; }

function updateCord(dt, input, time) {
  const pinch = input.pinch;
  const [wx, wy] = toWorld(input.x, input.y);
  if (pinch && !wasPinch) { cordX = wx; handleY = TOP_Y; grabbed = false; armed = true; }
  wasPinch = pinch;

  if (pinch) {
    cordX += (wx - cordX) * Math.min(1, dt * 14);
    if (!grabbed) {
      handleY += (wy - handleY) * Math.min(1, dt * 7);          // 위에서 손 쪽으로 내려옴
      if (Math.abs(handleY - wy) < 0.3) { grabbed = true; refY = wy; }
    } else {
      handleY = wy;
      if (armed) {
        refY = Math.max(refY, wy);
        if (refY - wy > PULL_DIST) { armed = false; clickY = wy; nextStage(); }
      } else if (wy > clickY + 0.7) { armed = true; refY = wy; }
    }
  } else {
    grabbed = false;
    handleY += (TOP_Y - handleY) * Math.min(1, dt * 5);         // 놓으면 줄이 올라감
  }
  bounce *= Math.exp(-dt * 7);
  const shown = handleY < HALF_H + 0.6 || pinch;
  cordGroup.visible = shown;
  const hy = handleY + bounce * Math.sin(time * 40);
  const len = TOP_Y - hy;
  cord.scale.y = Math.max(0.01, len); cord.position.set(cordX, (TOP_Y + hy) / 2, 0);
  handle.position.set(cordX, hy - 0.05, 0);
  const prog = grabbed && armed ? Math.min(1, (refY - wy) / PULL_DIST) : 0;
  bead.material.emissive.setRGB(prog * 0.7, prog * 0.45, prog * 0.2);
  return { pinch, grabbed, prog };
}

/* ---------------- 루프 ---------------- */
function resize() {
  SW = innerWidth; SH = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr); renderer.setSize(SW, SH, false);
  hud.width = SW * dpr; hud.height = SH * dpr; hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  camera.aspect = SW / SH; camera.updateProjectionMatrix();
  halfW = HALF_H * camera.aspect;
  clusterX = camera.aspect > 1.1 ? -halfW * 0.42 : 0;
  lanterns.forEach(l => { l.pivot.position.set(clusterX + l.d.dx, PIVOT_Y, 0); });
  if (layers.length) setLightLayer(stage, false);
}
addEventListener('resize', resize); resize();
setLightLayer(0, false);

let prevT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - prevT) / 1000); prevT = now; const time = now / 1000;

  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime; processHand(landmarker.detectForVideo(video, now), now);
  }
  const input = mouse.down ? { x: mouse.x, y: mouse.y, pinch: true, has: true } : hand;
  const st = updateCord(dt, input, time);

  // 색 전환 + 흔들림
  const target = STAGES[stage], k = 1 - Math.exp(-dt * 2.2);
  fabricCol.lerp(new THREE.Color(target.fabric), k); haloCol.lerp(new THREE.Color(target.halo), k);
  fabricMat.color.copy(fabricCol);
  lanterns.forEach((l) => {
    const flick = 1 + Math.sin(time * 3 + l.phase) * 0.015;
    l.vel += (-l.ang * 14 - l.vel * 1.4) * dt; l.ang += l.vel * dt;
    l.pivot.rotation.z = l.ang * 0.35 + Math.sin(time * 0.7 + l.phase) * 0.012;
    l.halo.material.color.copy(haloCol); l.halo.material.opacity = 0.5 * flick;
    l.bulb.material.color.copy(haloCol).lerp(new THREE.Color(0xfff0c8), 0.7);
  });
  renderer.render(scene, camera);

  // HUD: 손끝 표시
  hctx.clearRect(0, 0, SW, SH);
  if (input.has) {
    hctx.beginPath(); hctx.arc(input.x, input.y, st.pinch ? 12 : 8, 0, 7);
    hctx.lineWidth = 2; hctx.strokeStyle = st.pinch ? 'rgba(255,240,210,.95)' : 'rgba(255,255,255,.45)'; hctx.stroke();
    if (st.pinch) { hctx.fillStyle = 'rgba(255,220,170,.35)'; hctx.fill(); }
  }
}

/* ---------------- 시작 ---------------- */
function begin(msg) {
  $('#start').style.display = 'none';
  actx = new (window.AudioContext || window.webkitAudioContext)();
  hint.textContent = msg;
  requestAnimationFrame((t) => { prevT = t; frame(t); });
}
$('#go').onclick = async () => {
  begin('카메라 연결 중…');
  try { await startCamera(); hint.textContent = '검지와 중지를 붙여보세요 ✌️ → 줄을 아래로 딸깍'; }
  catch (e) { console.error(e); hint.textContent = '카메라/손 인식을 쓸 수 없어요 — 마우스를 누른 채 아래로 드래그하세요'; }
};
$('#nocam').onclick = () => begin('마우스를 누른 채 아래로 드래그하면 줄이 당겨져요');
</script>
