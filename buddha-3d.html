<title>분홍 부처상 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
  /* Layout: full-screen viewer, title top-left, controls bottom-center */
  :root {
    --bg: #efe8ea;
    --bg2: #f8f4f5;
    --fg: #3d2a31;
    --muted: #7d6a71;
    --chip: rgba(255, 255, 255, 0.72);
    --chip-line: rgba(61, 42, 49, 0.14);
    --accent: #b9808f;
    --display: "Gowun Batang", "Noto Serif KR", serif;
    --body: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1417; --bg2: #2b2024; --fg: #f1e4e8; --muted: #b59ca5;
      --chip: rgba(43, 32, 36, 0.78); --chip-line: rgba(241, 228, 232, 0.16);
      --accent: #d29aaa; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1417; --bg2: #2b2024; --fg: #f1e4e8; --muted: #b59ca5;
    --chip: rgba(43, 32, 36, 0.78); --chip-line: rgba(241, 228, 232, 0.16);
    --accent: #d29aaa; color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 38%, var(--bg2), var(--bg) 70%);
    color: var(--fg);
    font-family: var(--body);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  header {
    position: fixed; left: 0; top: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  h1 { margin: 0; font: 700 22px/1.2 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: none;
  }
  #hint { font-size: 13px; color: var(--muted); transition: opacity 0.6s; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
  button {
    font: 500 14px/1 var(--body); color: var(--fg);
    background: var(--chip); border: 1px solid var(--chip-line);
    padding: 11px 16px; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--accent); }
</style>

<div id="stage" aria-label="분홍 부처상 3D 모델. 드래그해서 돌려볼 수 있습니다."></div>
<header>
  <h1>분홍 부처상</h1>
  <p>원본 사진에서 깊이를 추정해 만든 3D · 360° 회전</p>
</header>
<footer>
  <div id="hint">손가락이나 마우스로 끌어서 돌려보세요</div>
  <div class="row">
    <button id="auto" type="button" aria-pressed="true">자동 회전</button>
    <button id="reset" type="button">정면 보기</button>
    <button id="back" type="button">뒷모습</button>
  </div>
</footer>

    box(0.40, 0.42, 70, 150, 0.8); box(0.5, 0.05, 420, 50, 0.9);
    const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding;
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromEquirectangular(t).texture;
    pm.dispose(); t.dispose();
  })();

  // 바닥 그림자
  (function () {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 4, 64, 64, 62);
    g.addColorStop(0, 'rgba(60,30,40,0.5)'); g.addColorStop(0.55, 'rgba(60,30,40,0.18)'); g.addColorStop(1, 'rgba(60,30,40,0)');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.001; scene.add(m);
  })();

  // 사진 색을 그대로 쓰고(emissive), 그 위에 유약 반사만 더한다
  function glazeMat(src) {
    const tex = new THREE.TextureLoader().load(src);
    tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 4;
    return new THREE.MeshPhysicalMaterial({
      color: 0x000000, emissive: 0xffffff, emissiveMap: tex,
      roughness: 0.22, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06,
      reflectivity: 0.5, envMapIntensity: 0.55
    });
  }
  const gF = grid(zF, false), gB = grid(zB, true);
  // 앞·뒷면이 만나는 윤곽선은 두 면의 법선을 합쳐 매끈하게 이어지게 한다
  (function stitchRim() {
    const nF = gF.attributes.normal.array, nB = gB.attributes.normal.array;
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
      const k = j * gw + i;
      if (!inMask(k) || !isRim(k)) continue;
      let x = nF[k * 3] + nB[k * 3], y = nF[k * 3 + 1] + nB[k * 3 + 1], z = nF[k * 3 + 2] + nB[k * 3 + 2];
      const l = Math.hypot(x, y, z) || 1; x /= l; y /= l; z /= l;
      nF[k * 3] = nB[k * 3] = x; nF[k * 3 + 1] = nB[k * 3 + 1] = y; nF[k * 3 + 2] = nB[k * 3 + 2] = z;
    }
  })();
  const statue = new THREE.Group();
  statue.add(new THREE.Mesh(gF, glazeMat('data:image/jpeg;base64,' + FRONT_JPG)));
  statue.add(new THREE.Mesh(gB, glazeMat('data:image/jpeg;base64,' + BACK_JPG)));
  scene.add(statue);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(TARGET);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minDistance = 2.4; controls.maxDistance = 8;
  controls.minPolarAngle = 0.25; controls.maxPolarAngle = Math.PI * 0.56;
  controls.rotateSpeed = 0.9;
  controls.autoRotate = true; controls.autoRotateSpeed = 1.6;

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 46 : 32;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  const autoBtn = document.getElementById('auto'), hint = document.getElementById('hint');
  function setAuto(on) { controls.autoRotate = on; autoBtn.setAttribute('aria-pressed', String(on)); }
  autoBtn.onclick = () => setAuto(!controls.autoRotate);
  controls.addEventListener('start', () => { setAuto(false); hint.style.opacity = 0; tween = null; });
  let tween = null;
  function flyTo(az) {
    const off = camera.position.clone().sub(controls.target);
    const from = Math.atan2(off.x, off.z); let d = az - from; d = Math.atan2(Math.sin(d), Math.cos(d));
    tween = { t0: performance.now(), from, d, fromPol: Math.acos(off.y / off.length()), pol: 1.55, fromR: off.length(), r: 5 };
    setAuto(false);
  }
  document.getElementById('reset').onclick = () => flyTo(0);
  document.getElementById('back').onclick = () => flyTo(Math.PI);

  (function loop() {
    requestAnimationFrame(loop);
    if (tween) {
      const t = Math.min(1, (performance.now() - tween.t0) / 800), e = t * t * (3 - 2 * t);
      const az = tween.from + tween.d * e, pol = tween.fromPol + (tween.pol - tween.fromPol) * e, r = tween.fromR + (tween.r - tween.fromR) * e;
      camera.position.set(controls.target.x + r * Math.sin(pol) * Math.sin(az), controls.target.y + r * Math.cos(pol), controls.target.z + r * Math.sin(pol) * Math.cos(az));
      if (t >= 1) tween = null;
    }
    controls.update();
    renderer.render(scene, camera);
  })();
  window.__statueReady = true;
})();
</script>
